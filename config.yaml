project:
  mode: release
  name: detectionx
  version: 1.0.0
  describe: ""

detection:
  model_path: "asset/models/detection/yolo11/coco/rk3588/detection_yolo11n_coco_int8.rknn"
  num_workers: 3
  threshold: 0.65
  classes:

mqtt:
  enable: false
  ip: localhost
  port: 1883
  interval: 500 # ms
  notify_topic: /perception/detectionx/results

rtsp:
  port: 16888
  width: 1280
  height: 720
  suffix: detectionx

tasks:
  - id: cam00001
    uri: /dev/video1
    region:
      type: xyxy
      xyxy: [ 100, 100, 200, 300 ]

