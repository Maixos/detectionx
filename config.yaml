project:
  mode: release
  name: detectionx
  version: 1.0.0
  describe: ""

detection:
  model_path: "asset/models/detection/yolo11/coco/rk3588/detection_yolo11s_coco_int8.rknn"
  num_workers: 1
  threshold: 0.6
  classes:

mqtt:
  enable: false
  ip: localhost
  port: 1883
  interval: 500 # ms
  notify_topic: /perception/detectionx/results

rtsp:
  port: 16888
  width: 1280
  height: 720
  suffix: detectionx

# tasks: 任务列表，每个任务对应一路视频源
#
# region.type 支持三种区域定义方式：
#   - ratio   : 四边相对边缘的比例区域
#               values = [left, top, right, bottom], 取值范围 [0, 1)
#
#   - xyxy    : 像素坐标矩形区域
#               values = [x1, y1, x2, y2]
#
#   - polygon : 多边形区域（像素坐标）
#               values = [ [x1, y1], [x2, y2], ... ]
#
